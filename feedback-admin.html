<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feedback Admin — Interactive Primer</title>
    <meta name="description" content="Review, export and clear page feedback." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/images/icons/favicon.ico" sizes="any" />
    <!-- Shared synchronous pre-paint: theme + locale, before the stylesheet. -->
    <script src="/dist/prepaint.js"></script>
    <link rel="stylesheet" href="/css/primer.css" />
    <style>
      body {
        margin: 0; background: var(--primer-bg, #fff); color: var(--primer-ink, #111);
        font-family: var(--primer-font-ui, system-ui, sans-serif);
      }
      main { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
      h1 { font-size: 1.4rem; margin: 0.5rem 0 1rem; }
      .toolbar {
        display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-bottom: 1rem;
        padding: 0.75rem; border: 1px solid var(--primer-border, #ddd);
        border-radius: var(--primer-radius, 0.6rem); background: var(--primer-surface, #fafafa);
      }
      .toolbar label { font-size: 0.85rem; display: flex; align-items: center; gap: 0.35rem; }
      .toolbar select, .toolbar input {
        font: inherit; font-size: 0.85rem; padding: 0.3rem 0.45rem;
        border: 1px solid var(--primer-border, #ccc); border-radius: 0.4rem;
        background: var(--primer-bg, #fff); color: var(--primer-ink, #111);
      }
      .toolbar input[type="text"] { width: 16rem; max-width: 40vw; }
      .toolbar .spacer { flex: 1; }
      .toolbar .count { font-size: 0.85rem; color: var(--primer-ink-soft, #667); }
      button {
        font: inherit; font-size: 0.82rem; cursor: pointer;
        padding: 0.32rem 0.7rem; border-radius: 0.4rem;
        border: 1px solid var(--primer-border, #ccc);
        background: var(--primer-surface, #fff); color: var(--primer-ink, #111);
      }
      button.primary { background: var(--primer-accent, #4d5bd1); color: #fff; border-color: transparent; }
      button.danger { color: var(--primer-danger, #b3261e); border-color: var(--primer-danger, #b3261e); }
      button:disabled { opacity: 0.5; cursor: default; }
      .page-row {
        border: 1px solid var(--primer-border, #ddd); border-radius: var(--primer-radius, 0.6rem);
        margin-bottom: 0.6rem; background: var(--primer-surface, #fff); overflow: hidden;
      }
      .page-head {
        display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: baseline;
        padding: 0.6rem 0.85rem; cursor: pointer;
      }
      .page-head:hover { background: color-mix(in srgb, var(--primer-accent, #4d5bd1) 6%, transparent); }
      .page-head .id { font-family: var(--primer-font-mono, monospace); font-size: 0.9rem; word-break: break-all; }
      .page-head .meta { font-size: 0.8rem; color: var(--primer-ink-soft, #667); white-space: nowrap; }
      .page-head .badge {
        font-size: 0.78rem; font-weight: 700; padding: 0.05rem 0.5rem; border-radius: 999px;
        background: var(--primer-accent, #4d5bd1); color: #fff;
      }
      .page-body { border-top: 1px solid var(--primer-border, #eee); padding: 0.6rem 0.85rem 0.85rem; }
      .page-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.6rem; }
      .fb-item {
        display: flex; gap: 0.6rem; align-items: flex-start;
        padding: 0.45rem 0; border-top: 1px dashed var(--primer-border, #eee);
      }
      .fb-item:first-of-type { border-top: none; }
      .fb-item .when { font-size: 0.78rem; color: var(--primer-ink-soft, #667); white-space: nowrap; padding-top: 0.1rem; }
      .fb-item .uid {
        font-size: 0.7rem; padding: 0.02rem 0.35rem; border-radius: 999px;
        border: 1px solid var(--primer-border, #ccc); color: var(--primer-ink-soft, #667);
      }
      .fb-item .msg { flex: 1; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
      .fb-item .del { line-height: 1; padding: 0.15rem 0.45rem; }
      .empty, .error { padding: 1rem; color: var(--primer-ink-soft, #667); font-size: 0.9rem; }
      .error { color: var(--primer-danger, #b3261e); }
      .flash { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
        background: var(--primer-ink, #111); color: var(--primer-bg, #fff);
        padding: 0.4rem 0.9rem; border-radius: 999px; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s; }
      .flash.show { opacity: 0.92; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <main id="main" tabindex="-1">
      <h1>Page feedback</h1>
      <div class="toolbar">
        <label>Order
          <select id="order">
            <option value="first">Oldest first feedback</option>
            <option value="count">Most feedbacks</option>
            <option value="last">Newest activity</option>
          </select>
        </label>
        <label>Path prefix
          <input type="text" id="prefix" placeholder="e.g. computer-science/chip-design" />
        </label>
        <label>Min count
          <input type="number" id="mincount" value="1" min="1" style="width:3.5rem" />
        </label>
        <span class="spacer"></span>
        <span class="count" id="summary-count"></span>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <div id="list"><p class="empty">Loading…</p></div>
    </main>
    <div class="flash" id="flash" role="status"></div>

    <script type="module">
      // Theme + menu from the built app bundle (no service worker here — admin wants freshness).
      const { app } = await (await fetch("/dist/asset-manifest.json")).json();
      const { initTheme, initLocale } = await import(app);
      initTheme();
      initLocale();
      document.body.appendChild(document.createElement("primer-menu"));

      // API base: same-origin /api in production; ?api=http://localhost:8787/api for wrangler dev.
      const API = new URLSearchParams(location.search).get("api") || "/api";

      const $ = (id) => document.getElementById(id);
      const listEl = $("list");
      const flashEl = $("flash");
      let pages = []; // [{ page, count, first, last }]
      const expanded = new Set(); // page ids currently expanded
      const itemsCache = new Map(); // page -> items[]

      const day = (ts) => new Date(ts).toISOString().slice(0, 10);
      const flash = (msg) => {
        flashEl.textContent = msg;
        flashEl.classList.add("show");
        setTimeout(() => flashEl.classList.remove("show"), 1800);
      };

      async function apiJson(path, opts) {
        const res = await fetch(`${API}${path}`, { credentials: "include", ...opts });
        const body = await res.json().catch(() => null);
        if (!res.ok || !body || body.ok !== true) throw new Error((body && body.error) || res.status);
        return body;
      }

      async function loadSummary() {
        listEl.innerHTML = '<p class="empty">Loading…</p>';
        try {
          const body = await apiJson("/feedback/summary");
          pages = body.pages || [];
          render();
        } catch (e) {
          listEl.innerHTML = "";
          const p = document.createElement("p");
          p.className = "error";
          p.textContent = `Could not load feedback summary (${e.message}). Is the API reachable?`;
          listEl.appendChild(p);
        }
      }

      function visiblePages() {
        const prefix = $("prefix").value.trim();
        const min = Math.max(1, Number($("mincount").value) || 1);
        const order = $("order").value;
        const out = pages.filter((p) => p.count >= min && (!prefix || p.page.startsWith(prefix)));
        if (order === "count") out.sort((a, b) => b.count - a.count || a.first - b.first);
        else if (order === "last") out.sort((a, b) => b.last - a.last);
        else out.sort((a, b) => a.first - b.first);
        return out;
      }

      function render() {
        const rows = visiblePages();
        $("summary-count").textContent =
          `${rows.length} page(s), ${rows.reduce((n, p) => n + p.count, 0)} feedback(s)`;
        listEl.innerHTML = "";
        if (!rows.length) {
          const p = document.createElement("p");
          p.className = "empty";
          p.textContent = "No feedback matches the current query.";
          listEl.appendChild(p);
          return;
        }
        for (const pageInfo of rows) listEl.appendChild(renderRow(pageInfo));
      }

      function renderRow(info) {
        const row = document.createElement("div");
        row.className = "page-row";

        const head = document.createElement("div");
        head.className = "page-head";
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = String(info.count);
        const id = document.createElement("a");
        id.className = "id";
        id.href = info.page.includes("/") ? `/concepts/${info.page}.html` : `/${info.page}`;
        id.target = "_blank";
        id.rel = "noopener";
        id.textContent = info.page;
        id.addEventListener("click", (e) => e.stopPropagation()); // link click ≠ expand
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = `first ${day(info.first)} · last ${day(info.last)}`;
        head.append(badge, id, meta);
        row.appendChild(head);

        const body = document.createElement("div");
        body.className = "page-body";
        body.hidden = !expanded.has(info.page);
        row.appendChild(body);
        if (!body.hidden) void fillBody(body, info);

        head.addEventListener("click", () => {
          if (expanded.has(info.page)) {
            expanded.delete(info.page);
            body.hidden = true;
          } else {
            expanded.add(info.page);
            body.hidden = false;
            void fillBody(body, info);
          }
        });
        return row;
      }

      async function fillBody(body, info) {
        body.innerHTML = '<p class="empty">Loading…</p>';
        let items;
        try {
          ({ items } = await apiJson(`/feedback?page=${encodeURIComponent(info.page)}`));
        } catch (e) {
          body.innerHTML = `<p class="error">Could not load items (${e.message}).</p>`;
          return;
        }
        itemsCache.set(info.page, items);
        body.innerHTML = "";

        const actions = document.createElement("div");
        actions.className = "page-actions";
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "primary";
        copyBtn.textContent = "Copy for Claude";
        copyBtn.addEventListener("click", async () => {
          await navigator.clipboard.writeText(claudeChunk(info.page, items));
          flash("Copied to clipboard");
        });
        const delAllBtn = document.createElement("button");
        delAllBtn.type = "button";
        delAllBtn.className = "danger";
        delAllBtn.textContent = `Delete all (${items.length})`;
        delAllBtn.addEventListener("click", async () => {
          if (!confirm(`Delete all ${items.length} feedback item(s) for ${info.page}?`)) return;
          try {
            await apiJson(`/feedback?page=${encodeURIComponent(info.page)}`, { method: "DELETE" });
            pages = pages.filter((p) => p.page !== info.page);
            expanded.delete(info.page);
            render();
            flash("Deleted");
          } catch (e) {
            flash(`Delete failed (${e.message})`);
          }
        });
        actions.append(copyBtn, delAllBtn);
        body.appendChild(actions);

        for (const item of items) {
          const el = document.createElement("div");
          el.className = "fb-item";
          const when = document.createElement("span");
          when.className = "when";
          when.textContent = day(item.createdAt || 0);
          const msg = document.createElement("span");
          msg.className = "msg";
          msg.textContent = item.message || "";
          const del = document.createElement("button");
          del.type = "button";
          del.className = "danger del";
          del.setAttribute("aria-label", "Delete this feedback");
          del.textContent = "×";
          del.addEventListener("click", async () => {
            if (!confirm("Delete this feedback item?")) return;
            try {
              await apiJson(`/feedback?key=${encodeURIComponent(item.key)}`, { method: "DELETE" });
              el.remove();
              info.count -= 1;
              if (info.count <= 0) pages = pages.filter((p) => p.page !== info.page);
              render();
              flash("Deleted");
            } catch (e) {
              flash(`Delete failed (${e.message})`);
            }
          });
          el.append(when);
          if (item.uid) {
            const uid = document.createElement("span");
            uid.className = "uid";
            uid.title = item.uid;
            uid.textContent = `user ${item.uid.slice(0, 6)}`;
            el.append(uid);
          }
          el.append(msg, del);
          body.appendChild(el);
        }
      }

      function claudeChunk(page, items) {
        const file = page.includes("/") ? `concepts/${page}.html` : page;
        const lines = [
          `## Feedback for ${file}  (${items.length} item(s), first ${day(items[0]?.createdAt || Date.now())})`,
          ``,
          `Assess each item's quality; improve the page where the feedback is valid; ignore junk.`,
          ``,
        ];
        items.forEach((item, i) => {
          const msg = (item.message || "").trim().replace(/\r\n/g, "\n");
          lines.push(`${i + 1}. [${day(item.createdAt || 0)}] ${msg.replace(/\n/g, "\n   ")}`);
        });
        return lines.join("\n") + "\n";
      }

      $("order").addEventListener("change", render);
      $("prefix").addEventListener("input", render);
      $("mincount").addEventListener("input", render);
      $("refresh").addEventListener("click", () => void loadSummary());
      void loadSummary();
    </script>
  </body>
</html>
